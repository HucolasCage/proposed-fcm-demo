let run = data.examples[data.defaultExample];
let index = 0;
let playing = false;
let timer;
let animation;
let displayCenters = run.frames[0].centers;

const minimum = [0, 1].map((axis) => Math.min(...data.points.map((point) => point[axis])));
const maximum = [0, 1].map((axis) => Math.max(...data.points.map((point) => point[axis])));
const numeric = (value, digits = 3) => Number.isFinite(value) ? value.toFixed(digits) : "\u{2014}";
const percent = (value) => numeric(100 * value, 2) + "%";

function baselineIndexAt(frame) {
  if (frame.kind === "stop") return run.baseline.length - 1;
  const next = run.baseline.findIndex((item) => item.scan > frame.scan);
  return next === -1 ? run.baseline.length - 1 : next - 1;
}

function describe(frame) {
  const n = run.parameters.n;
  const objectiveRow = ["\u{5f53}\u{524d}\u{76ee}\u{6807}\u{503c} F", numeric(frame.objective)];
  const before = ["\u{66f4}\u{65b0}\u{524d}\u{76ee}\u{6807}\u{503c}", numeric(frame.previousObjective)];
  const candidate = ["\u{5019}\u{9009}\u{76ee}\u{6807}\u{503c}", numeric(frame.candidateObjective), "candidate"];
  const threshold = ["\u{8981}\u{6c42}\u{7684}\u{76ee}\u{6807}\u{4e0a}\u{9650}", numeric(frame.threshold)];
  switch (frame.kind) {
    case "init":
      return ["\u{4e24}\u{4e2a}\u{65b9}\u{6cd5}\u{4ece}\u{540c}\u{4e00}\u{4f4d}\u{7f6e}\u{51fa}\u{53d1}", "\u{4e24}\u{5f20}\u{56fe}\u{91cc}\u{7684}\u{56db}\u{4e2a}\u{521d}\u{59cb}\u{4e2d}\u{5fc3}\u{5b8c}\u{5168}\u{76f8}\u{540c}\u{3002}\u{53f3}\u{4e0b}\u{65b9}\u{7684}\u{68d5}\u{8272}\u{70b9}\u{662f}\u{9884}\u{5148}\u{6807}\u{51fa}\u{7684} 20 \u{4e2a}\u{5c0f}\u{7c07}\u{6837}\u{672c}\u{3002}",
        [["\u{6837}\u{672c}\u{6570}", n], ["\u{521d}\u{59cb}\u{4e2d}\u{5fc3}\u{6570} K", run.parameters.k], ["\u{968f}\u{673a}\u{79cd}\u{5b50}", run.parameters.seed]]];
    case "batch":
      return ["\u{770b}\u{4e00}\u{6279}\u{6570}\u{636e}\u{ff0c}\u{79fb}\u{52a8}\u{4e00}\u{6b21}\u{4e2d}\u{5fc3}", "\u{9ad8}\u{4eae}\u{70b9}\u{662f}\u{8fd9}\u{4e00}\u{6279}\u{53c2}\u{4e0e}\u{8ba1}\u{7b97}\u{7684}\u{6837}\u{672c}\u{3002}\u{7b97}\u{6cd5}\u{8ba1}\u{7b97}\u{5b83}\u{4eec}\u{5bf9}\u{6bcf}\u{4e2a}\u{4e2d}\u{5fc3}\u{7684}\u{96b6}\u{5c5e}\u{5ea6}\u{ff0c}\u{518d}\u{7ed3}\u{5408}\u{6298}\u{6743}\u{540e}\u{7684}\u{5386}\u{53f2}\u{7edf}\u{8ba1}\u{91cf}\u{66f4}\u{65b0}\u{4e2d}\u{5fc3}\u{3002}",
        [["\u{5f53}\u{524d}\u{6279}\u{6837}\u{672c}\u{6570}", frame.batch.length], ["\u{5df2}\u{5904}\u{7406}\u{6837}\u{672c}\u{6570}", frame.seen + " / " + n],

    case "warm_eval":
      return ["\u{7528}\u{5168}\u{90e8}\u{6837}\u{672c}\u{68c0}\u{67e5}\u{9884}\u{70ed}\u{7ed3}\u{679c}", "\u{5c0f}\u{6279}\u{91cf}\u{5df2}\u{8986}\u{76d6}\u{5168}\u{90e8}\u{6837}\u{672c}\u{4e00}\u{6b21}\u{3002}\u{73b0}\u{5728}\u{5728}\u{9884}\u{70ed}\u{5f97}\u{5230}\u{7684}\u{4e2d}\u{5fc3}\u{5904}\u{91cd}\u{7b97}\u{6240}\u{6709}\u{96b6}\u{5c5e}\u{5ea6}\u{548c}\u{76ee}\u{6807}\u{503c}\u{ff0c}\u{4f9b}\u{4e0b}\u{4e00}\u{6b65}\u{6bd4}\u{8f83}\u{3002}", [objectiveRow]];

      return ["\u{5c0f}\u{7c07}\u{83b7}\u{5f97}\u{81ea}\u{5df1}\u{7684}\u{4e2d}\u{5fc3}", "\u{7528}\u{5168}\u{90e8}\u{6837}\u{672c}\u{6bd4}\u{8f83}\u{91cd}\u{7f6e}\u{524d}\u{540e}\u{7684}\u{76ee}\u{6807}\u{503c}\u{3002}\u{6574}\u{4f53}\u{76ee}\u{6807}\u{53d8}\u{5c0f}\u{540e}\u{ff0c}\u{53f3}\u{4e0b}\u{65b9}\u{7684}\u{65b0}\u{4e2d}\u{5fc3}\u{6b63}\u{5f0f}\u{751f}\u{6548}\u{3002}",
        [before, ["\u{91cd}\u{7f6e}\u{540e}\u{76ee}\u{6807}\u{503c}", numeric(frame.objective)]]];
    case "reset_reject":

    case "fcm_step":
      return ["\u{5148}\u{505a}\u{4e00}\u{6b65}\u{6807}\u{51c6} FCM", "\u{76ee}\u{524d}\u{8fd8}\u{6ca1}\u{6709}\u{53ef}\u{7528}\u{7684}\u{66f2}\u{7387}\u{5386}\u{53f2}\u{3002}\u{7528}\u{5168}\u{90e8}\u{6837}\u{672c}\u{7684}\u{96b6}\u{5c5e}\u{5ea6}\u{91cd}\u{65b0}\u{8ba1}\u{7b97}\u{52a0}\u{6743}\u{4e2d}\u{5fc3}\u{ff0c}\u{5e76}\u{7528}\u{672c}\u{6b21}\u{66f4}\u{65b0}\u{5efa}\u{7acb}\u{5272}\u{7ebf}\u{5386}\u{53f2}\u{3002}",
        [before, objectiveRow]];
    case "trial_accept":
      return ["\u{4e0b}\u{964d}\u{8db3}\u{591f}\u{ff0c}\u{63a5}\u{53d7}\u{8bd5}\u{63a2}", "\u{62df}\u{725b}\u{987f}\u{6b65}\u{5229}\u{7528}\u{8fd1}\u{51e0}\u{6b21}\u{66f4}\u{65b0}\u{79ef}\u{7d2f}\u{7684}\u{4fe1}\u{606f}\u{63d0}\u{51fa}\u{65b0}\u{4e2d}\u{5fc3}\u{3002}\u{5019}\u{9009}\u{76ee}\u{6807}\u{8fbe}\u{5230}\u{6807}\u{51c6} FCM \u{6240}\u{80fd}\u{4fdd}\u{8bc1}\u{7684}\u{4e0b}\u{964d}\u{5e45}\u{5ea6}\u{ff0c}\u{56e0}\u{6b64}\u{91c7}\u{7528}\u{8fd9}\u{4e00}\u{7ec4}\u{4e2d}\u{5fc3}\u{3002}",
        [before, threshold, ["\u{63a5}\u{53d7}\u{540e}\u{76ee}\u{6807}\u{503c}", numeric(frame.objective)]]];
    case "trial_reject":
      return [frame.candidateObjective < frame.objective ? "\u{76ee}\u{6807}\u{964d}\u{4e86}\u{ff0c}\u{4f46}\u{964d}\u{5f97}\u{4e0d}\u{591f}" : "\u{8bd5}\u{63a2}\u{672a}\u{964d}\u{4f4e}\u{76ee}\u{6807}\u{503c}",
        "\u{6a59}\u{8272}\u{865a}\u{7ebf}\u{662f}\u{8bd5}\u{63a2}\u{7684}\u{4f4d}\u{7f6e}\u{3002}\u{5019}\u{9009}\u{9ad8}\u{4e8e}\u{4e0b}\u{964d}\u{68c0}\u{9a8c}\u{7ed9}\u{51fa}\u{7684}\u{4e0a}\u{9650}\u{ff0c}\u{5f53}\u{524d}\u{4e2d}\u{5fc3}\u{4fdd}\u{7559}\u{5728}\u{539f}\u{4f4d}\u{3002}\u{63a5}\u{4e0b}\u{6765}\u{56de}\u{9000}\u{5230}\u{4e00}\u{6b21}\u{6807}\u{51c6} FCM \u{66f4}\u{65b0}\u{3002}",
        [objectiveRow, candidate, threshold]];
    case "fallback":
      return ["\u{56de}\u{5230}\u{6807}\u{51c6} FCM \u{66f4}\u{65b0}", "\u{6e05}\u{7a7a}\u{65e7}\u{7684}\u{5272}\u{7ebf}\u{5386}\u{53f2}\u{ff0c}\u{7528}\u{5f53}\u{524d}\u{96b6}\u{5c5e}\u{5ea6}\u{7684}\u{52a0}\u{6743}\u{5747}\u{503c}\u{66f4}\u{65b0}\u{4e2d}\u{5fc3}\u{3002}\u{6ce8}\u{610f}\u{56de}\u{9000}\u{4e5f}\u{9700}\u{8981}\u{4e00}\u{6b21}\u{5168}\u{6570}\u{636e}\u{626b}\u{63cf}\u{3002}",
        [["\u{88ab}\u{62d2}\u{7684}\u{8bd5}\u{63a2}\u{76ee}\u{6807}", numeric(frame.rejectedObjective), "candidate"], ["\u{56de}\u{9000}\u{540e}\u{76ee}\u{6807}\u{503c}", numeric(frame.objective)]]];
    case "stop":
      return ["\u{4e24}\u{79cd}\u{65b9}\u{6cd5}\u{7684}\u{6700}\u{7ec8}\u{7ed3}\u{679c}", exampleSelect.value === "reset"
        ? "\u{6807}\u{51c6} FCM \u{628a}\u{53f3}\u{4e0b}\u{65b9}\u{7684}\u{5c0f}\u{7c07}\u{5168}\u{90e8}\u{5e76}\u{5230}\u{53f3}\u{4e0a}\u{7684}\u{7c07}\u{3002}\u{91cd}\u{7f6e}\u{4f7f}\u{6240}\u{63d0}\u{65b9}\u{6cd5}\u{7ed9}\u{5c0f}\u{7c07}\u{7559}\u{51fa}\u{4e00}\u{4e2a}\u{72ec}\u{7acb}\u{4e2d}\u{5fc3}\u{3002}\u{5de6}\u{53f3}\u{5206}\u{522b}\u{663e}\u{793a}\u{4e24}\u{79cd}\u{65b9}\u{6cd5}\u{8fbe}\u{5230}\u{505c}\u{6b62}\u{5bb9}\u{5dee}\u{65f6}\u{7684}\u{4f4d}\u{7f6e}\u{3002}"
        : "\u{5de6}\u{53f3}\u{5206}\u{522b}\u{663e}\u{793a}\u{4e24}\u{79cd}\u{65b9}\u{6cd5}\u{8fbe}\u{5230}\u{505c}\u{6b62}\u{5bb9}\u{5dee}\u{65f6}\u{7684}\u{4e2d}\u{5fc3}\u{4f4d}\u{7f6e}\u{ff0c}\u{626b}\u{63cf}\u{6570}\u{53ef}\u{80fd}\u{4e0d}\u{540c}\u{3002}",
      [["\u{6700}\u{7ec8}\u{76ee}\u{6807}\u{503c}\u{ff08}\u{6240}\u{63d0} / FCM\u{ff09}", numeric(run.result.proposed.objective) + " / " + numeric(run.result.baseline.objective)],
        ["\u{626b}\u{63cf}\u{6570}\u{ff08}\u{6240}\u{63d0} / FCM\u{ff09}", run.result.proposed.scans + " / " + run.result.baseline.scans],
        ["ACC\u{ff08}\u{6240}\u{63d0} / FCM\u{ff09}", percent(run.result.proposed.accuracy) + " / " + percent(run.result.baseline.accuracy)]]];
  }
}

function surface(canvas) {
  const bounds = canvas.getBoundingClientRect();
  const w = bounds.width;
  const h = bounds.height;
  const scale = Math.min(window.devicePixelRatio || 1, 2);
  const width = Math.round(w * scale);
  const height = Math.round(h * scale);
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

function dot(ctx, [x, y], radius, color, outline) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, 2 * Math.PI);
  ctx.fillStyle = color;
  ctx.fill();
  if (outline) {
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.7;
    ctx.stroke();
  }
}

function path(ctx, positions, color, weight, dash = []) {
  if (positions.length < 2) return;
  ctx.beginPath();
  positions.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.strokeStyle = color;
  ctx.lineWidth = weight;
  ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
}

function plotCloud(canvas, centers, traces, frame) {
  const { ctx, w, h } = surface(canvas);
  const rx = maximum[0] - minimum[0];
  const ry = maximum[1] - minimum[1];
  const inset = w < 245 ? 20 : 34;
  const scale = Math.min((w - 2 * inset) / rx, (h - 40) / ry);
  const project = ([x, y]) => [w / 2 + scale * (x - (maximum[0] + minimum[0]) / 2),
    h / 2 - scale * (y - (maximum[1] + minimum[1]) / 2)];

  for (let x = 15; x <= w - 15; x += 31) path(ctx, [[x, 17], [x, h - 17]], "#e7eff0", 1);
  for (let y = 17; y <= h - 16; y += 31) path(ctx, [[15, y], [w - 15, y]], "#e7eff0", 1);
  const highlighted = new Set(frame?.batch ?? []);
  const pointRadius = w < 245 ? 1.7 : 2.45;
  data.points.forEach((point, id) => {
    const visible = highlighted.has(id);
    const color = minority.has(id) ? (visible ? "#986332" : "#b78142") : (visible ? "#4d9ca0" : "#aabdc6");
    dot(ctx, project(point), pointRadius + (visible ? .65 : 0), color);
  });
  centers.forEach((center, id) => {
    const color = centersPalette[id];
    const positions = [...traces.map((item) => project(item[id])), project(center)];
    path(ctx, positions, color + "85", frame?.kind === "reset_accept" ? 2.5 : 1.5);
  });
  if (["reset_propose", "reset_reject", "trial_reject"].includes(frame?.kind)) {
    frame.candidateCenters.forEach((point, id) => {
      const source = frame.centers[id];
      if (Math.hypot(point[0] - source[0], point[1] - source[1]) < .012) return;
      path(ctx, [project(source), project(point)], warm, 1.8, [5, 5]);
      dot(ctx, project(point), 7, "#fff6ec", warm);
    });
  }
  centers.forEach((center, id) => {
    const [x, y] = project(center);
    const radius = w < 245 ? 4.8 : 6.4;
    dot(ctx, [x, y], radius + 1.5, "#fff");
    dot(ctx, [x, y], radius, centersPalette[id]);
    ctx.font = (w < 245 ? "600 10px" : "600 12px") + " system-ui, sans-serif";
    ctx.textAlign = x > w - 37 ? "right" : "left";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#172c34";
    ctx.fillText("C" + (id + 1), x + (x > w - 37 ? -9 : 9), y - 10);
  });
}

function drawCloud() {
  const frame = run.frames[index];
  const first = run.frames.findIndex((item) => item.stage === frame.stage);
  const traces = run.frames.slice(first, index).map((item) => item.centers);
  if (frame.fromCenters) traces.push(frame.fromCenters);
  plotCloud(cloud, displayCenters, traces, frame);
}

function drawBaselineCloud() {
  const past = baselineIndexAt(run.frames[index]);
  const traces = run.baseline.slice(Math.max(0, past - 6), past).map((frame) => frame.centers);
  plotCloud(fcmCloud, run.baseline[past].centers, traces);
}

const isTrial = (frame) => frame.kind === "reset_reject" || frame.kind === "trial_reject";
const acceptedUpdate = (frame) => Number.isFinite(frame.objective) &&
  !["reset_propose", "reset_reject", "trial_reject", "stop"].includes(frame.kind);

function drawObjective() {
  const { ctx, w, h } = surface(objective);
  const current = run.frames[index];
  const showBaseline = byId("baseline").checked;
  const xMax = Math.max(run.result.proposed.scans, showBaseline ? run.result.baseline.scans : 0);
  const domain = [...run.frames.filter(acceptedUpdate).map((frame) => frame.objective),
    ...run.frames.filter(isTrial).map((frame) => frame.candidateObjective),
    ...(showBaseline ? run.baseline.map((frame) => frame.objective).filter(Number.isFinite) : [])];
  const spread = Math.max(...domain) - Math.min(...domain);
  const step = spread > 90 ? 30 : spread > 45 ? 15 : 10;
  const yMin = Math.floor(Math.min(...domain) / step) * step;
  const yMax = Math.ceil(Math.max(...domain) / step) * step;
  const left = 40, top = 13, right = w - 15, bottom = h - 32;
  const x = (scan) => left + (right - left) * scan / xMax;
  const y = (value) => bottom - (bottom - top) * (value - yMin) / (yMax - yMin || 1);
  ctx.font = "12px system-ui, sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let value = yMin; value <= yMax; value += step) {
    const yy = y(value);
    path(ctx, [[left, yy], [right, yy]], "#e0e9ec", 1);
    ctx.fillStyle = "#4c646d";
    ctx.fillText(String(value), left - 8, yy);
  }
  ctx.textAlign = "center";
  const tick = xMax > 25 ? 5 : 2;
  for (let q = 0; q <= xMax; q += tick) ctx.fillText(String(q), x(q), bottom + 11);
  ctx.fillText("\u{7b49}\u{4ef7}\u{5168}\u{6570}\u{636e}\u{626b}\u{63cf}\u{6570}", (left + right) / 2, h - 8);
  if (current.scan > 0) path(ctx, [[x(current.scan), top], [x(current.scan), bottom]], "#8fa9ad", 1, [3, 4]);
  const limit = current.kind === "stop" ? xMax : current.scan;
  const series = [
    ...(showBaseline ? [[run.baseline.filter((frame) => frame.scan <= limit && Number.isFinite(frame.objective)), blue, [5, 4]]] : []),
    [run.frames.slice(0, index + 1).filter(acceptedUpdate), teal, []],
  ];
  for (const [frames, color, dash] of series) {
    const positions = frames.map((frame) => [x(frame.scan), y(frame.objective)]);
    path(ctx, positions, color, 2.1, dash);
    positions.forEach((point) => dot(ctx, point, 2.7, color));
  }
  run.frames.slice(0, index + 1).filter(isTrial).forEach((frame) => {
    dot(ctx, [x(frame.scan), y(frame.candidateObjective)], 4, "#fff", warm);
  });
}

function updateInterface() {
  const frame = run.frames[index];
  const [title, body, rows] = describe(frame);
  byId("step-label").textContent = stageNames[frame.stage];
  byId("step-title").textContent = title;
  byId("step-body").textContent = body;
  byId("numbers").replaceChildren(...rows.map(([label, value, type]) => {
    const row = document.createElement("div");
    if (type) row.className = type;
    const name = document.createElement("dt");
    name.textContent = label;
    const cell = document.createElement("dd");
    cell.textContent = value;
    row.append(name, cell);
    return row;
  }));
  byId("scan").textContent = "\u{7b49}\u{4ef7}\u{626b}\u{63cf} " + (Number.isInteger(frame.scan) ? frame.scan : frame.scan.toFixed(2));
  byId("fcm-scan").textContent = "\u{7b49}\u{4ef7}\u{626b}\u{63cf} " + run.baseline[baselineIndexAt(frame)].scan;
  byId("parameters").textContent = run.parameters.n + " \u{4e2a}\u{6837}\u{672c}  \u{b7}  K = " + run.parameters.k + "  \u{b7}  m = " + run.parameters.m;
  stageButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.stage === frame.stage)));
  timeline.max = run.frames.length - 1;
  timeline.value = index;
  timeline.setAttribute("aria-valuetext", title + " \u{b7} " + (index + 1) + " / " + run.frames.length);
  byId("frame-count").textContent = (index + 1) + " / " + run.frames.length;
  byId("prev").disabled = index === 0;
  byId("next").disabled = index === run.frames.length - 1;
  byId("jump-fallback").hidden = !run.frames.some((item) => item.kind === "trial_reject");
}

function show(target, animate = false) {
  cancelAnimationFrame(animation);
  const previous = displayCenters;
  index = Math.min(run.frames.length - 1, Math.max(0, target));
  const next = run.frames[index].centers;
  updateInterface();
  drawObjective();
  drawBaselineCloud();
  if (!animate || motion.matches) {
    displayCenters = next;
    drawCloud();
    return;
  }
  const start = performance.now();
  const duration = run.frames[index].kind === "reset_accept" ? 690 : 390;
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const ease = 1 - (1 - t) ** 3;
    displayCenters = next.map((point, id) => point.map((value, axis) =>
      previous[id][axis] + ease * (value - previous[id][axis])));
    drawCloud();
    if (t < 1) animation = requestAnimationFrame(tick);
  }
  animation = requestAnimationFrame(tick);
}

function setPlay(active) {
  clearTimeout(timer);
  playing = active;
  byId("play").setAttribute("aria-pressed", String(active));
  byId("play-text").textContent = active ? "\u{6682}\u{505c}" : "\u{64ad}\u{653e}";
  if (!active) return;
  if (index === run.frames.length - 1) show(0);
  function advance() {
    show(index + 1, true);
    if (index === run.frames.length - 1) setPlay(false);
    else timer = setTimeout(advance, index < 8 ? 930 : 1450);
  }
  timer = setTimeout(advance, 580);
}

function seek(target, animate = false) {
  setPlay(false);
  show(target, animate);
}

exampleSelect.value = data.defaultExample;
exampleSelect.addEventListener("change", () => {
  run = data.examples[exampleSelect.value];
  seek(0);
});
stageButtons.forEach((button) => button.addEventListener("click",
  () => seek(run.frames.findIndex((frame) => frame.stage === button.dataset.stage))));
byId("play").addEventListener("click", () => setPlay(!playing));
byId("prev").addEventListener("click", () => seek(index - 1));
byId("next").addEventListener("click", () => seek(index + 1, true));
byId("finish").addEventListener("click", () => seek(run.frames.length - 1));
timeline.addEventListener("input", () => seek(Number(timeline.value)));
byId("jump-fallback").addEventListener("click", () => seek(run.frames.findIndex(isTrialRefine)));
byId("baseline").addEventListener("change", (event) => {
  byId("baseline-key").hidden = !event.target.checked;
  drawObjective();
});
function isTrialRefine(frame) {
  return frame.kind === "trial_reject";
}
