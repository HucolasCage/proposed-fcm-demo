function surface(canvas) {
  const bounds = canvas.getBoundingClientRect();
  const w = bounds.width;
  const h = bounds.height;
  const scale = Math.min(window.devicePixelRatio || 1, 2);
  const width = Math.round(w * scale);
  const height = Math.round(h * scale);
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

function dot(ctx, [x, y], radius, color, outline) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, 2 * Math.PI);
  ctx.fillStyle = color;
  ctx.fill();
  if (outline) {
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.7;
    ctx.stroke();
  }
}

function path(ctx, positions, color, weight, dash = []) {
  if (positions.length < 2) return;
  ctx.beginPath();
  positions.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.strokeStyle = color;
  ctx.lineWidth = weight;
  ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
}

    const color = centersPalette[id];
    const positions = [...traces.map((item) => project(item[id])), project(center)];
    path(ctx, positions, color + "85", frame.kind === "reset_accept" ? 2.5 : 1.7);
  });
  if (["reset_propose", "reset_reject", "trial_reject"].includes(frame.kind)) {
    frame.candidateCenters.forEach((point, id) => {
      const source = frame.centers[id];
      if (Math.hypot(point[0] - source[0], point[1] - source[1]) < .012) return;
      path(ctx, [project(source), project(point)], warm, 1.8, [5, 5]);
      dot(ctx, project(point), 7, "#fff6ec", warm);
    });
  }
  displayCenters.forEach((center, id) => {
    const [x, y] = project(center);
    dot(ctx, [x, y], 8.5, "#fff");
    dot(ctx, [x, y], 6.65, centersPalette[id]);
    ctx.font = "600 12px system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#172c34";
    ctx.fillText("C" + (id + 1), x + 12, y - 10);
  });
}

const isTrial = (frame) => frame.kind === "reset_reject" || frame.kind === "trial_reject";
const acceptedUpdate = (frame) => Number.isFinite(frame.objective) &&
  !["reset_propose", "reset_reject", "trial_reject", "stop"].includes(frame.kind);

function drawObjective() {
  const { ctx, w, h } = surface(objective);
  const current = run.frames[index];
  const showBaseline = byId("baseline").checked;
  const xMax = Math.max(run.result.proposed.scans, showBaseline ? run.result.baseline.scans : 0);
  const domain = [...run.frames.filter(acceptedUpdate).map((frame) => frame.objective),
    ...run.frames.filter(isTrial).map((frame) => frame.candidateObjective),
    ...(showBaseline ? run.baseline.map((frame) => frame.objective).filter(Number.isFinite) : [])];
  const spread = Math.max(...domain) - Math.min(...domain);
  const step = spread > 90 ? 30 : spread > 45 ? 15 : 10;
  const yMin = Math.floor(Math.min(...domain) / step) * step;
  const yMax = Math.ceil(Math.max(...domain) / step) * step;
  const left = 40, top = 13, right = w - 15, bottom = h - 32;
  const x = (scan) => left + (right - left) * scan / xMax;
  const y = (value) => bottom - (bottom - top) * (value - yMin) / (yMax - yMin || 1);
  ctx.font = "12px system-ui, sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let value = yMin; value <= yMax; value += step) {
    const yy = y(value);
    path(ctx, [[left, yy], [right, yy]], "#e0e9ec", 1);
    ctx.fillStyle = "#4c646d";
    ctx.fillText(String(value), left - 8, yy);
  }
  ctx.textAlign = "center";
  const tick = xMax > 25 ? 5 : 2;
  for (let q = 0; q <= xMax; q += tick) ctx.fillText(String(q), x(q), bottom + 11);
  ctx.fillText("\u7b49\u4ef7\u5168\u6570\u636e\u626b\u63cf\u6570", (left + right) / 2, h - 8);
  if (current.scan > 0) path(ctx, [[x(current.scan), top], [x(current.scan), bottom]], "#8fa9ad", 1, [3, 4]);
  const limit = current.kind === "stop" ? xMax : current.scan;
  const series = [
    ...(showBaseline ? [[run.baseline.filter((frame) => frame.scan <= limit && Number.isFinite(frame.objective)), blue, [5, 4]]] : []),
    [run.frames.slice(0, index + 1).filter(acceptedUpdate), teal, []],
  ];
  for (const [frames, color, dash] of series) {
    const positions = frames.map((frame) => [x(frame.scan), y(frame.objective)]);
    path(ctx, positions, color, 2.1, dash);
    positions.forEach((point) => dot(ctx, point, 2.7, color));
  }
  run.frames.slice(0, index + 1).filter(isTrial).forEach((frame) => {
    dot(ctx, [x(frame.scan), y(frame.candidateObjective)], 4, "#fff", warm);
  });
}

function updateInterface() {
  const frame = run.frames[index];
  const [title, body, rows] = describe(frame);
  byId("step-label").textContent = stageNames[frame.stage];
  byId("step-title").textContent = title;
  byId("step-body").textContent = body;
  byId("numbers").replaceChildren(...rows.map(([label, value, type]) => {
    const row = document.createElement("div");
    if (type) row.className = type;
    const name = document.createElement("dt");
    name.textContent = label;
    const cell = document.createElement("dd");
    cell.textContent = value;
    row.append(name, cell);
    return row;
  }));
  byId("scan").textContent = "\u7b49\u4ef7\u626b\u63cf " + (Number.isInteger(frame.scan) ? frame.scan : frame.scan.toFixed(2));
  byId("parameters").textContent = run.parameters.n + " \u4e2a\u6837\u672c  \u00b7  K = " + run.parameters.k + "  \u00b7  m = " + run.parameters.m;
  stageButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.stage === frame.stage)));
  timeline.max = run.frames.length - 1;
  timeline.value = index;
  timeline.setAttribute("aria-valuetext", title + " \u00b7 " + (index + 1) + " / " + run.frames.length);
  byId("frame-count").textContent = (index + 1) + " / " + run.frames.length;
  byId("prev").disabled = index === 0;
  byId("next").disabled = index === run.frames.length - 1;
  byId("jump-fallback").hidden = !run.frames.some((item) => item.kind === "trial_reject");
}

function show(target, animate = false) {
  cancelAnimationFrame(animation);
  const previous = displayCenters;
  index = Math.min(run.frames.length - 1, Math.max(0, target));
  const next = run.frames[index].centers;
  updateInterface();
  drawObjective();
  if (!animate || motion.matches) {
    displayCenters = next;
    drawCloud();
    return;
  }
  const start = performance.now();
  const duration = run.frames[index].kind === "reset_accept" ? 690 : 390;
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const ease = 1 - (1 - t) ** 3;
    displayCenters = next.map((point, id) => point.map((value, axis) =>
      previous[id][axis] + ease * (value - previous[id][axis])));
    drawCloud();
    if (t < 1) animation = requestAnimationFrame(tick);
  }
  animation = requestAnimationFrame(tick);
}

function setPlay(active) {
  clearTimeout(timer);
  playing = active;
  byId("play").setAttribute("aria-pressed", String(active));
  byId("play-text").textContent = active ? "\u6682\u505c" : "\u64ad\u653e";
  if (!active) return;
  if (index === run.frames.length - 1) show(0);
  function advance() {
    show(index + 1, true);
    if (index === run.frames.length - 1) setPlay(false);
    else timer = setTimeout(advance, index < 8 ? 930 : 1450);
  }
  timer = setTimeout(advance, 580);
}

function seek(target, animate = false) {
  setPlay(false);
  show(target, animate);
}

exampleSelect.value = data.defaultExample;
exampleSelect.addEventListener("change", () => {
  run = data.examples[exampleSelect.value];
  seek(0);
});
stageButtons.forEach((button) => button.addEventListener("click",
  () => seek(run.frames.findIndex((frame) => frame.stage === button.dataset.stage))));
byId("play").addEventListener("click", () => setPlay(!playing));
byId("prev").addEventListener("click", () => seek(index - 1));
byId("next").addEventListener("click", () => seek(index + 1, true));
timeline.addEventListener("input", () => seek(Number(timeline.value)));
byId("jump-fallback").addEventListener("click", () => seek(run.frames.findIndex(isTrialRefine)));
byId("baseline").addEventListener("change", (event) => {
  byId("baseline-key").hidden = !event.target.checked;
  drawObjective();
});
function isTrialRefine(frame) {
  return frame.kind === "trial_reject";
}
new ResizeObserver(drawCloud).observe(cloud);
new ResizeObserver(drawObjective).observe(objective);
show(0);
setPlay(false);

</script>
</body>
</html>
